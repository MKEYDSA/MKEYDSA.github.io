---
title: QR Code Generator
layout: "center.liquid"

eleventyExcludeFromCollections: true
---

<style>
    h2 {
        margin-bottom: 0;
    }

    table {
        width: 100%;
    }

    td {
        color: white;
        padding: 5px;
        width: 20%;
        overflow-x: hidden;
    }

    #submit, #download {
        margin-top: 20px;
        margin-bottom: 20px;
        width: 100%;
        padding: 20px 0;
        border-radius: 5px;
    }

    #download {
        display: none;
        background: var(--stem-green);
        color: white;
        text-align: center;
    }

    #qrcode {
        margin-bottom: 20px;
        width: fit-content;
        max-width: 100%;
    }
</style>

<script src="/static/script/dependencies/davidshimjs-qrcodejs-04f46c6/qrcode.min.js"></script>

<h1>{{ title }}</h1>

<form>
    <label>
        URL:
        <input type="url" name="url" placeholder="https://mkeydsa.org" style="width:100%;" required>
    </label>
    
    <label>
        Size:
        <select name="size" required>
            <option value="1">1x</option>
            <option value="2">2x</option>
            <option value="4">4x</option>
            <option value="8">8x</option>
            <option value="16">16x</option>
        </select>
    </label><br>

    <h2>Colors</h2>

    <label>
        Foreground:
        <input type="color" name="foreground" value="#231F20" required>
    </label>

    <label>
        Background:
        <input type="color" name="background" value="#FFFFFF" required>
    </label><br>

    <details>
        <summary>DSA Colors</summary>

        <table>
            <tr>
                <td style="background:#231F20">#231F20</td>
                <td style="background:#3B3838">#3B3838</td>
                <td style="background:#605C5C">#605C5C</td>
                <td style="background:#8C8989">#8C8989</td>
                <td style="background:#C1C0BF">#C1C0BF</td>
            </tr>
            <tr>
                <td style="background:#EC1F27">#EC1F27</td>
                <td style="background:#F04C53">#F04C53</td>
                <td style="background:#F4797E">#F4797E</td>
                <td style="background:#F7A5A9">#F7A5A9</td>
                <td style="background:#FBD2D4">#FBD2D4</td>
            </tr>
        </table>
    </details>

    <input id="submit" type="submit" value="Generate!">
</form>

<div id="qrcode"></div>

<a id="download" href="" download>Download</button>

<script type="text/javascript">
    const params = new URLSearchParams(window.location.search);

    if (params.get('url').trim() != "") {
        const qrcode = new QRCode(document.getElementById('qrcode'), {
            text: params.get('url'),
            width: 128 * params.get('size'),
            height: 128 * params.get('size'),
            colorDark : params.get('foreground'),
            colorLight : params.get('background'),
            correctLevel : QRCode.CorrectLevel.H
        });

        let download = document.getElementById('download');

        setTimeout(function(){
            download.style.display = "block";
            download.href = document.querySelector('#qrcode img').currentSrc;
        }, 1000);
    }
</script>
